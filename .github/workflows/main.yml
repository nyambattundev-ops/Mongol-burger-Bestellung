name: Build Mongol Burger APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Android-Projekt entpacken
        run: |
          unzip -q MongolBurgerAndroid_v2.zip -d extracted
          cp -r extracted/MongolBurgerAndroid/. .

      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        run: gradle assembleDebug

      - name: APK speichern
        uses: actions/upload-artifact@v4
        with:
          name: MongolBurger-apk
          path: app/build/outputs/apk/debug/app-debug.apk
